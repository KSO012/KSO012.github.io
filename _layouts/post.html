---
layout: default
nav: blog
---
<article class="post">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← Blog</a>
  <div class="eyebrow">{{ page.date | date: '%Y. %m. %d' }}{% if page.category %} · {{ page.category }}{% endif %}</div>
  <h1>{{ page.title }}</h1>
  <div class="post-body">{{ content }}</div>
</article>
