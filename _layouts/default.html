<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>
    {% if page.url == '/' %}
      Seon Kim | Portfolio
    {% elsif page.title %}
      {{ page.title | escape }} | Seon Kim
    {% else %}
      Seon Kim
    {% endif %}
  </title>
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Seon Kim<span class="brand-dot">.</span></a>
      <nav aria-label="주 메뉴">
        <a href="{{ '/research/' | relative_url }}" {% if page.nav == 'research' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/journal/' | relative_url }}" {% if page.nav == 'journal' %}aria-current="page"{% endif %}>Journal</a>
        <a href="{{ '/conference/' | relative_url }}" {% if page.nav == 'conference' %}aria-current="page"{% endif %}>Conference</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.nav == 'about' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/contact/' | relative_url }}" {% if page.nav == 'contact' %}aria-current="page"{% endif %}>Contact</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page-wrap">{{ content }}</main>
  <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} Seon Kim</span><a href="https://github.com/KSO012">GitHub ↗</a></footer>
</body>
</html>
